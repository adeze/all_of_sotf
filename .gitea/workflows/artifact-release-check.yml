name: Selectable release artifact check

on:
  workflow_dispatch:
    inputs:
      artifact_group:
        description: One release artifact group to build and inspect
        type: choice
        options: [desktop, plugins, autoeq, systemwide, au]
        required: true
      platform:
        description: Build host (systemwide and AU require macOS)
        type: choice
        options: [macos, linux]
        required: true

jobs:
  macos:
    if: inputs.platform == 'macos'
    runs-on: m4
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Build and inspect selected artifact
        env:
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT_GROUP" == plugins ]]; then
            bash scripts/release/fetch_macos_plugin_validators.sh 2>&1 | tee macos-plugin-validator-download.log
            export PATH="$(cat release-artifact-evidence-plugins-macos/validators/bin-path.txt):$PATH"
          fi
          bash scripts/release/artifact_check.sh "$ARTIFACT_GROUP" macos
      - name: Upload artifact and evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-artifact-macos-${{ inputs.artifact_group }}
          path: |
            checkout-sources.log
            macos-plugin-validator-download.log
            release-artifact-evidence-*/
          if-no-files-found: warn

  linux:
    if: inputs.platform == 'linux' && inputs.artifact_group != 'plugins' && inputs.artifact_group != 'desktop'
    runs-on: x86:linux:host
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Build and inspect selected artifact
        env:
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
        run: bash scripts/release/artifact_check.sh "$ARTIFACT_GROUP" linux
      - name: Upload artifact and evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-artifact-linux-${{ inputs.artifact_group }}
          path: |
            checkout-sources.log
            release-artifact-evidence-*/
          if-no-files-found: warn

  linux_display:
    if: inputs.platform == 'linux' && (inputs.artifact_group == 'plugins' || inputs.artifact_group == 'desktop')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable Linux display environment
        run: |
          set -euo pipefail
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ]; then
            echo 'Linux plugin setup requires a disposable root-owned Gitea container'
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl unzip file build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libclang-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
            xvfb xauth dbus dbus-x11 at-spi2-core python3-pyatspi python3-gi gir1.2-atspi-2.0 \
            xdotool imagemagick
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v just >/dev/null 2>&1 || [ "$(just --version)" != 'just 1.58.0' ]; then
            cargo install just --version 1.58.0 --force
          fi
          if [ "$(rustc --version | awk '{print $2}')" != '1.99.0' ] || [ "$(just --version)" != 'just 1.58.0' ]; then
            echo 'Linux plugin toolchain differs from pinned release QA versions'
            exit 1
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          command -v Xvfb
          command -v xvfb-run
          command -v dbus-run-session
          command -v xdotool
          command -v import
          /usr/bin/python3 -c 'import pyatspi'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Fetch pinned Linux plugin validators
        if: inputs.artifact_group == 'plugins'
        run: |
          set -euo pipefail
          bash scripts/release/fetch_linux_plugin_validators.sh 2>&1 | tee linux-plugin-validator-download.log
      - name: Build and inspect Linux artifact under private display
        env:
          ARTIFACT_GROUP: ${{ inputs.artifact_group }}
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT_GROUP" == plugins ]]; then
            export PATH="$(cat release-artifact-evidence-plugins-linux/validators/bin-path.txt):$CARGO_HOME/bin:$PATH"
          else
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x900x24 +extension RANDR +extension XTEST' \
            bash scripts/release/artifact_check.sh "$ARTIFACT_GROUP" linux
      - name: Upload artifact and evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-artifact-linux-${{ inputs.artifact_group }}
          path: |
            checkout-sources.log
            linux-plugin-validator-download.log
            release-artifact-evidence-*/
          if-no-files-found: warn
