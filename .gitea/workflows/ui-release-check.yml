name: Display-required release UI QA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all
      vello_diagnostic:
        description: Capture Linux Vello renderer initialization validation errors
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run macOS UI QA with a display
        run: bash scripts/release/ui_check.sh macos
      - name: Upload macOS UI evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-ui-macos
          path: |
            checkout-sources.log
            release-ui-evidence-macos/
            sotf/target/qa-gpui/
          if-no-files-found: warn

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Prepare disposable Linux UI environment
        run: |
          set -euo pipefail
          mkdir -p release-ui-evidence-linux
          exec > >(tee release-ui-evidence-linux/prerequisite.log) 2>&1
          uname -a
          id
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ]; then
            echo 'Linux UI setup requires the disposable root-owned Gitea container; refusing host package changes'
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config libssl-dev \
            libasound2-dev libclang-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
            xvfb xauth xdotool imagemagick dbus dbus-x11 at-spi2-core python3-pyatspi python3-gi
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v just >/dev/null 2>&1 || [ "$(just --version)" != 'just 1.58.0' ]; then
            cargo install just --version 1.58.0 --force
          fi
          rustc --version
          cargo --version
          just --version
          if [ "$(rustc --version | awk '{print $2}')" != '1.99.0' ] || [ "$(just --version)" != 'just 1.58.0' ]; then
            echo 'Linux UI toolchain versions differ from the pinned release QA versions'
            exit 1
          fi
          command -v mold
          command -v Xvfb
          command -v xvfb-run
          command -v xauth
          command -v dbus-run-session
          /usr/bin/python3 -c 'import gi, pyatspi; print("system AT-SPI Python ready")'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Enable opt-in Linux Vello diagnostic
        if: inputs.vello_diagnostic == 'true'
        run: echo 'SOTF_VELLO_VALIDATE_INIT=1' >> "$GITHUB_ENV"
      - name: Require Xvfb and run Linux UI QA with a display
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p release-ui-evidence-linux
          if ! command -v xvfb-run || ! command -v Xvfb || ! command -v xauth; then
            echo 'Xvfb and xauth are required for Linux release UI QA' | tee release-ui-evidence-linux/display-error.log
            exit 1
          fi
          runtime_dir=$(mktemp -d)
          chmod 700 "$runtime_dir"
          trap 'rm -rf "$runtime_dir"' EXIT
          export XDG_RUNTIME_DIR="$runtime_dir"
          dbus-run-session -- xvfb-run -a -s '-screen 0 2560x2400x24' bash scripts/release/ui_check.sh linux
      - name: Upload Linux UI evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-ui-linux
          path: |
            checkout-sources.log
            release-ui-evidence-linux/
            sotf/target/qa-gpui/
          if-no-files-found: warn
