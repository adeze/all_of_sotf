name: Guarded formatter candidate qualification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        options: [all, linux, macos]
        default: all

jobs:
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CI: 'true'
      DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare private Linux build environment
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          test ! -e /dev/snd
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libjack-jackd2-dev libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev \
            libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
          if ! command -v cargo >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          rustup component add clippy rustfmt --toolchain 1.99.0
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --version 1.58.0
          fi
          test "$(just --version | awk '{print $2}')" = 1.58.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Checkout exact candidate siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Require supervisor regressions and run all inventories
        run: |
          set -euo pipefail
          export CARGO_HOME="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ.get("CARGO_HOME") or pathlib.Path.home()/".cargo").expanduser().resolve())')"
          export RUSTUP_HOME="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ.get("RUSTUP_HOME") or pathlib.Path.home()/".rustup").expanduser().resolve())')"
          export HOME="$PWD/target/release-gitea/format-private-home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export PYTHONOPTIMIZE=0 PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME/.cargo" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          python3 -m unittest scripts.release.test_all_features_supervision scripts.release.test_format_candidate_handoff -v 2>&1 | tee format-supervision.log
          grep -Eq '^Ran 7 tests in ' format-supervision.log
          grep -Eq '^OK$' format-supervision.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' format-supervision.log
          set +e
          python3 scripts/release/format_candidate_check.py target/release-gitea/format-candidate
          format_result=$?
          set -e
          python3 - <<'PY'
          import json, pathlib
          report=json.loads(pathlib.Path('target/release-gitea/format-candidate/report.json').read_text())
          from scripts.release.format_candidate_check import safe_to_start_next_phase
          assert safe_to_start_next_phase(report), 'formatter interrupted or owned cleanup incomplete'
          PY
          set +e
          python3 scripts/release/all_features_candidate_check.py target/release-gitea/format-all-features
          compile_result=$?
          set -e
          test "$format_result" -eq 0 && test "$compile_result" -eq 0
      - name: Upload complete Linux evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: format-candidate-linux
          path: |
            checkout-sources.log
            format-supervision.log
            target/release-gitea/format-candidate/
            target/release-gitea/format-all-features/
          if-no-files-found: error

  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CI: 'true'
      DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare verified toolchain
        run: |
          set -euo pipefail
          export CARGO_HOME="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ.get("CARGO_HOME") or pathlib.Path.home()/".cargo").expanduser().resolve())')"
          export RUSTUP_HOME="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ.get("RUSTUP_HOME") or pathlib.Path.home()/".rustup").expanduser().resolve())')"
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          rustup component add clippy rustfmt --toolchain 1.99.0
          test "$(just --version | awk '{print $2}')" = 1.58.0
      - name: Checkout exact candidate siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Require supervisor regressions and run all inventories
        run: |
          set -euo pipefail
          export CARGO_HOME="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ.get("CARGO_HOME") or pathlib.Path.home()/".cargo").expanduser().resolve())')"
          export RUSTUP_HOME="$(python3 -c 'import os,pathlib; print(pathlib.Path(os.environ.get("RUSTUP_HOME") or pathlib.Path.home()/".rustup").expanduser().resolve())')"
          export HOME="$PWD/target/release-gitea/format-private-home"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export PYTHONOPTIMIZE=0 PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME/.cargo" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          python3 -m unittest scripts.release.test_all_features_supervision scripts.release.test_format_candidate_handoff -v 2>&1 | tee format-supervision.log
          grep -Eq '^Ran 7 tests in ' format-supervision.log
          grep -Eq '^OK$' format-supervision.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' format-supervision.log
          set +e
          python3 scripts/release/format_candidate_check.py target/release-gitea/format-candidate
          format_result=$?
          set -e
          python3 - <<'PY'
          import json, pathlib
          report=json.loads(pathlib.Path('target/release-gitea/format-candidate/report.json').read_text())
          from scripts.release.format_candidate_check import safe_to_start_next_phase
          assert safe_to_start_next_phase(report), 'formatter interrupted or owned cleanup incomplete'
          PY
          set +e
          python3 scripts/release/all_features_candidate_check.py target/release-gitea/format-all-features
          compile_result=$?
          set -e
          test "$format_result" -eq 0 && test "$compile_result" -eq 0
      - name: Upload complete macOS evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: format-candidate-macos
          path: |
            checkout-sources.log
            format-supervision.log
            target/release-gitea/format-candidate/
            target/release-gitea/format-all-features/
          if-no-files-found: error
