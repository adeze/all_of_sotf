name: Aggregate release QA

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      phase:
        description: Release gate
        type: choice
        options: [metadata, check, tests, qa, resolve]
        default: check
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all
      workspace:
        description: Optional focused Linux workspace; all retains full phase scope
        type: choice
        options: [all, math-audio]
        default: all

jobs:
  macos:
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.phase != 'resolve') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos') && (github.event_name != 'workflow_dispatch' || (inputs.workspace || 'all') == 'all')
    runs-on: m4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Validate macOS release sources
        env:
          RELEASE_PHASE: ${{ github.event.inputs.phase || 'metadata' }}
        run: |
          if [ "$RELEASE_PHASE" = qa ]; then
            echo 'The full macOS QA recipe includes physical audio/HAL tests. Run the reviewed mac-safe-full-qa lane; physical coverage remains INCOMPLETE.' >&2
            exit 1
          fi
          python3 scripts/release/qa.py "$RELEASE_PHASE" --platform macos --require-clean --output target/release-gitea/aggregate-qa-macos
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aggregate-qa-macos
          path: |
            checkout-sources.log
            target/release-gitea/aggregate-qa-macos/
          if-no-files-found: error

  linux:
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.phase != 'resolve') && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-latest
    needs: scripts
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CI: 'true'
      DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare private audio-device-free Linux container
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          test ! -e /dev/snd
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libjack-jackd2-dev libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev \
            libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
          if ! command -v cargo >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          rustup component add clippy --toolchain 1.99.0
          rustup component add rustfmt --toolchain 1.99.0
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --version 1.58.0
          fi
          test "$(just --version | awk '{print $2}')" = 1.58.0
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install cargo-nextest --version 0.9.143
          fi
          test "$(cargo nextest --version | awk 'NR == 1 { print $2 }')" = 0.9.143
          cargo fmt --version
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Validate Linux release sources
        env:
          RELEASE_PHASE: ${{ github.event.inputs.phase || 'metadata' }}
          RELEASE_WORKSPACE: ${{ github.event.inputs.workspace || 'all' }}
        run: |
          set -euo pipefail
          release_workspace_args=()
          if [ "$RELEASE_WORKSPACE" = math-audio ]; then
            release_workspace_args=(--workspace math-audio)
            echo 'Focused Math Audio QA only; full release coverage remains incomplete.'
          elif [ "$RELEASE_WORKSPACE" != all ]; then
            echo 'Unsupported focused workspace' >&2
            exit 2
          fi
          QA_PRIVATE_HOME="$PWD/target/release-gitea/private-home"
          QA_RUNTIME_DIR="$PWD/target/release-gitea/private-runtime"
          mkdir -p "$QA_PRIVATE_HOME/.cargo" "$QA_PRIVATE_HOME/config" "$QA_PRIVATE_HOME/cache" "$QA_RUNTIME_DIR/systemwide"
          chmod 700 "$QA_PRIVATE_HOME" "$QA_RUNTIME_DIR" "$QA_RUNTIME_DIR/systemwide"
          env HOME="$QA_PRIVATE_HOME" XDG_CONFIG_HOME="$QA_PRIVATE_HOME/config" \
            XDG_CACHE_HOME="$QA_PRIVATE_HOME/cache" XDG_RUNTIME_DIR="$QA_RUNTIME_DIR" \
            PULSE_SERVER="unix:$QA_RUNTIME_DIR/no-pulse" PIPEWIRE_REMOTE=no-pipewire \
            JACK_DEFAULT_SERVER=no-jack JACK_NO_START_SERVER=1 \
            SOTF_SYSTEMWIDE_RUNTIME_DIR="$QA_RUNTIME_DIR/systemwide" \
            SOTF_SYSTEMWIDE_STATE_PATH="$QA_RUNTIME_DIR/systemwide/state.json" \
            python3 scripts/release/qa.py "$RELEASE_PHASE" --platform linux --require-clean --output target/release-gitea/aggregate-qa-linux "${release_workspace_args[@]}"
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aggregate-qa-linux
          path: |
            checkout-sources.log
            target/release-gitea/aggregate-qa-linux/
          if-no-files-found: error

  scripts:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.phase != 'resolve'
    runs-on: x86:linux:host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Parse root Justfile without running recipes
        run: just --list
      - name: Validate release maintenance scripts
        run: |
          set -euo pipefail
          python3 -m venv .release-venv
          .release-venv/bin/python -m pip install pytest tomlkit
          PATH="$PWD/.release-venv/bin:$PATH" bash scripts/bacon/scripts-check.sh 2>&1 | tee scripts-qa.log
      - name: Prove aggregate command ownership and test inventory
        run: |
          set -euo pipefail
          .release-venv/bin/python -m pytest -q scripts/release/test_qa.py \
            -k 'test_inventory or test_interruption_before_spawn or test_owned_descendant or test_sigterm_during_live_owned_command or test_rejected_upmixer_experiments or test_gpui_release_validator' \
            2>&1 | tee aggregate-supervisor-preflight.log
          grep -Eq '^8 passed' aggregate-supervisor-preflight.log
          ! grep -Eq ' skipped| xfailed| xpassed' aggregate-supervisor-preflight.log
      - name: Upload script QA evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aggregate-scripts-qa
          path: |
            scripts-qa.log
            aggregate-supervisor-preflight.log
          if-no-files-found: error

  dependency-graph:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.phase != 'resolve'
    runs-on: x86:linux:host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Audit dependency graph
        run: python3 scripts/release/dependency_graph.py --output dependency-graph.json
      - name: Upload dependency graph evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aggregate-dependency-graph
          path: |
            checkout-sources.log
            dependency-graph.json
          if-no-files-found: warn

  resolve:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.phase == 'resolve'
    runs-on: x86:linux:host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Resolve sibling lockfiles
        run: python3 scripts/release/resolve_sources.py --output release-resolution
      - name: Audit proposed dependency graph
        if: always()
        run: python3 scripts/release/dependency_graph.py --output dependency-graph.json
      - name: Upload proposed lockfiles and metadata
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aggregate-lock-resolution
          path: |
            checkout-sources.log
            dependency-graph.json
            release-resolution/
          if-no-files-found: warn
