name: Isolated Linux systemwide full recipes

on:
  workflow_dispatch:

jobs:
  linux:
    # This runner label starts a disposable container. Do not mount host audio
    # devices or forward host PulseAudio/PipeWire/JACK sockets into this job.
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CI: 'true'
      DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare private audio-device-free container
        run: |
          set -euo pipefail
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ] || [ -e /dev/snd ]; then
            echo 'Linux systemwide QA requires a disposable root-owned container without /dev/snd' >&2
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libjack-jackd2-dev libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev \
            libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          if [ "$(rustc --version | awk '{print $2}')" != '1.99.0' ]; then
            echo 'Rust toolchain differs from pinned release QA version' >&2
            exit 1
          fi
          command -v rustup
          rustup component add clippy --toolchain 1.99.0
          cargo clippy --version
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --version 1.58.0
          fi
          if [ "$(just --version | awk '{print $2}')" != '1.58.0' ]; then
            echo 'Just version differs from pinned release QA version' >&2
            exit 1
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Prove owned cleanup and positive inventory guards
        run: |
          set -euo pipefail
          mkdir -p target/release-systemwide-full-preflight
          python3 -m unittest -v scripts.release.test_systemwide_linux_full_check \
            > target/release-systemwide-full-preflight/tests.log 2>&1
          grep -Eq '^Ran 3 tests in ' target/release-systemwide-full-preflight/tests.log
          grep -Eq '^OK$' target/release-systemwide-full-preflight/tests.log
          ! grep -Eq 'skipped|expected failure|unexpected success' \
            target/release-systemwide-full-preflight/tests.log
      - name: Run owned systemwide check and qa recipes
        run: python3 scripts/release/systemwide_linux_full_check.py target/release-gitea/systemwide-full-linux
      - name: Upload complete Linux systemwide evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: systemwide-full-linux
          path: |
            checkout-sources.log
            target/release-systemwide-full-preflight/
            target/release-gitea/systemwide-full-linux/
          if-no-files-found: warn
