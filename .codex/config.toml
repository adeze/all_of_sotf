# Opt into repository tools; specialist MCP servers default off in user config.
[mcp_servers.smlibpy]
enabled = true

[plugins."whiteboard@devfast".mcp_servers.whiteboard]
enabled = true

[mcp_servers.rust_analyzer]
command = "/opt/homebrew/bin/uv"
args = ["run", "--no-project", "--with", "mcp", "python", "/Users/adam/Development/adeze/all_of_sotf/.codex/rust_analyzer_mcp.py"]
enabled_tools = ["lookup_symbol"]
startup_timeout_sec = 120
tool_timeout_sec = 120
