# Mono overlay for the `sotf` directory: per-repo participation in the
# aggregate Cargo workspace. Optional schema:
#   [mono]
#   exclude_members = ["crates/something"]  # skip these members in mono
[mono]
# TEMPORARY (issue #4): reverse-dependency closure of the autoeq and
# sotf-capture root packages, which cannot join mono until those repo roots
# are virtualized (cargo: "multiple workspace roots"). Rejoins untouched.
exclude_members = [
    "crates/app-cli",
    "crates/app-gpui",
    "crates/app-ios",
    "crates/app-tui",
    "crates/app-tvos",
    "crates/sotf-calibration-workbench",
    "crates/sotf-docs-gen",
    "crates/sotf-player",
    "crates/sotf-server/crates/sotf-federation",
]
