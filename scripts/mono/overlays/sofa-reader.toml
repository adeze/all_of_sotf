# Mono overlay for the `sofa-reader` directory: per-repo participation in
# the aggregate Cargo workspace. Optional schema:
#   [mono]
#   exclude_members = ["crates/something"]  # skip these members in mono
[mono]
# PERMANENT: sofa-reader is its own workspace root (standalone hygiene) and
# every consumer takes it via git, so mono resolves the git rev and never
# lists the working copy (cargo forbids root packages in outer workspaces).
# Run its tests standalone (just local-test-sofa-reader).
exclude_members = [
    ".",
]
