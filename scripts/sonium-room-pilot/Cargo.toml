[package]
name = "sonium-room-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sonium-solvers-sparse = { path = "../../sonium/crates/sonium-solvers/crates/sonium-solvers-sparse" }
rerun = { version = "0.40.0", optional = true, default-features = false, features = ["sdk", "web_viewer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
viewer = ["dep:rerun"]

[profile.dev]
opt-level = 1
debug = 0
incremental = false
split-debuginfo = "packed"

[profile.test]
debug = 0
incremental = false
