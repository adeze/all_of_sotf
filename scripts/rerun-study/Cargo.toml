[package]
name = "rerun-study"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rerun = { version = "0.40.0", default-features = false, features = ["sdk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
re_log_encoding = { version = "0.40.0", default-features = false, features = ["decoder"] }
re_log_types = "0.40.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
