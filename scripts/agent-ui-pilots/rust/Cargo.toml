[package]
name = "roomcal-agui-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
ag-ui-client = "=0.1.0"
ag-ui-core = "=0.1.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sotf-dev-api = { path = "../../../sotf/crates/sotf-dev-api" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
