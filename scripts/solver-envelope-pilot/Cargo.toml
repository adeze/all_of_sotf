[package]
name = "solver-envelope-pilot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
autoeq-optim = { path = "../../autoeq/crates/autoeq-optim" }
ndarray = "0.17"
rerun = { version = "0.40.0", default-features = false, features = ["sdk", "web_viewer"] }
serde_json = "1"
