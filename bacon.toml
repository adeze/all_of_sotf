#:schema https://dystroy.org/bacon/.bacon.schema.json

# Aggregated bacon setup: 9 Rust workspaces + Python maintenance scripts.
#
# There is no Cargo.toml at the root, so the default cargo file watching is
# disabled and every job declares its own `watch` paths. `apply_gitignore`
# is off because the root .gitignore excludes the nested workspace checkouts
# (each workspace has its own .git); build outputs are excluded with the
# explicit `ignore` patterns below instead.
#
# Usage (from the repo root):
#   bacon                 # check all Rust workspaces in parallel (default)
#   bacon clippy-all      # clippy --all-targets everywhere
#   bacon test            # cargo test everywhere
#   bacon scripts         # Python scripts: syntax + pytest
#   bacon check-sotf      # focused check of one workspace
#   BACON_WORKSPACES="sotf autoeq" bacon check   # check a subset

default_job = "check"
env.CARGO_TERM_COLOR = "always"

default_watch = false
apply_gitignore = false
ignore = [
    # cargo / build outputs
    "target", "target-static", ".docker-target",
    # python caches and environments
    "__pycache__", "*.pyc", ".pytest_cache", "venv", ".venv",
    # vcs / tooling / generated state (never hand-written source)
    ".git", ".tokensave", "TAGS", ".DS_Store", "*.log",
    "dist", "builds", "data_generated", "data_cached", "tmp",
]

# Rust aggregate jobs watch every workspace; each job fans out through
# scripts/bacon/cargo-all.sh so all workspaces build in parallel.
watch = [
    "autoeq",
    "gpui-toolkit",
    "math-audio",
    "sofa-reader",
    "sotf",
    "sotf-capture",
    "sotf-daw",
    "sotf-systemwide",
    "symphonia-add-ons",
]

[jobs.check]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false

[jobs.check-all]
command = ["scripts/bacon/cargo-all.sh", "check", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["scripts/bacon/cargo-all.sh", "clippy"]
need_stdout = false

[jobs.clippy-all]
command = ["scripts/bacon/cargo-all.sh", "clippy", "--all-targets"]
need_stdout = false

[jobs.test]
command = ["scripts/bacon/cargo-all.sh", "test"]
need_stdout = true

[jobs.nextest]
command = [
    "scripts/bacon/cargo-all.sh", "nextest", "run",
    "--hide-progress-bar", "--failure-output", "final",
]
need_stdout = true
analyzer = "nextest"

[jobs.mono-check]
command = ["cargo", "check", "--workspace", "--locked", "--manifest-path", "Cargo.toml"]
need_stdout = false

[jobs.scripts]
command = ["scripts/bacon/scripts-check.sh"]
need_stdout = true
analyzer = "python_pytest"
watch = ["scripts"]

# Focused single-workspace checks (same fan-out script, restricted to one
# workspace so diagnostic paths stay root-relative for bacon navigation).
[jobs.check-autoeq]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["autoeq"]
env.BACON_WORKSPACES = "autoeq"

[jobs.check-gpui-toolkit]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["gpui-toolkit"]
env.BACON_WORKSPACES = "gpui-toolkit"

[jobs.check-math-audio]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["math-audio"]
env.BACON_WORKSPACES = "math-audio"

[jobs.check-sofa-reader]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["sofa-reader"]
env.BACON_WORKSPACES = "sofa-reader"

[jobs.check-sotf]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["sotf"]
env.BACON_WORKSPACES = "sotf"

[jobs.check-sotf-daw]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["sotf-daw"]
env.BACON_WORKSPACES = "sotf-daw"

[jobs.check-sotf-capture]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["sotf-capture"]
env.BACON_WORKSPACES = "sotf-capture"

[jobs.check-sotf-systemwide]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["sotf-systemwide"]
env.BACON_WORKSPACES = "sotf-systemwide"

[jobs.check-symphonia-add-ons]
command = ["scripts/bacon/cargo-all.sh", "check"]
need_stdout = false
watch = ["symphonia-add-ons"]
env.BACON_WORKSPACES = "symphonia-add-ons"

[keybindings]
c = "job:clippy-all" # comment this to have 'c' run clippy on only the default target
m = "job:mono-check"
